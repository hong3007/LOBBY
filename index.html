<style>
  :root { --bg:#fff8f1; --dot:#ffd9e3; --text:#4a3b52; --sub:#8a7a94; --mix:75%; --shadow:#e9d5c9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#231e2b; --dot:#3a2f45; --text:#f3e9f7; --sub:#b9a9c4; --mix:22%; --shadow:#15111a; } }
  * { box-sizing: border-box; }
  body { margin:0; color:var(--text); font-family:"Jua","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg) radial-gradient(var(--dot) 2px, transparent 2.5px) 0 0/26px 26px; min-height:100vh; }
  header { display:flex; align-items:center; gap:12px; max-width:1100px; margin:0 auto; padding:28px 16px 6px; }
  header svg { width:44px; height:44px; animation:wiggle 2.4s ease-in-out infinite; }
  h1 { font-size:28px; margin:0; font-weight:400; }
  h1 small { display:block; font-size:15px; color:var(--sub); }
  #note { color:var(--sub); font-size:14px; margin-left:auto; background:color-mix(in srgb,var(--bg) 70%,#fff 30%); padding:4px 12px; border-radius:99px; }
  main { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:18px; max-width:1100px; margin:0 auto; padding:16px 16px 48px; }
  a.tile { position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; padding:22px 14px 16px; border-radius:28px;
    background:color-mix(in srgb, var(--p) var(--mix), var(--bg)); border:3px solid var(--p); color:inherit; text-decoration:none;
    box-shadow:0 6px 0 var(--shadow); transition:transform .25s cubic-bezier(.3,1.8,.5,1), box-shadow .25s;
    animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards; animation-delay:calc(var(--i) * 60ms); }
  a.tile:hover, a.tile:focus-visible { transform:translateY(-6px) rotate(var(--r)); box-shadow:0 12px 0 var(--shadow); outline:none; }
  a.tile:active { transform:translateY(2px) scale(.97); box-shadow:0 2px 0 var(--shadow); }
  .emo { font-size:40px; width:72px; height:72px; display:grid; place-items:center; border-radius:50%; background:#fff8; }
  a.tile:hover .emo { animation:bounce .6s ease; }
  .name { font-size:19px; word-break:break-all; }
  .desc { color:var(--sub); font-size:14px; flex:1; }
  .site { font-size:13px; background:#fff; color:#4a3b52; border-radius:99px; padding:3px 10px; border:2px solid var(--p); }
  .code { position:absolute; top:10px; right:12px; font-size:13px; color:var(--sub); text-decoration:none; padding:2px 8px; border-radius:99px; }
  .code:hover { background:#fff8; color:var(--text); }
  @keyframes pop { from { opacity:0; transform:scale(.6); } }
  @keyframes bounce { 30% { transform:translateY(-10px) scale(1.1); } 60% { transform:translateY(0) scale(.95); } }
  @keyframes wiggle { 0%,100% { transform:rotate(-6deg); } 50% { transform:rotate(6deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1e293b"/><rect x="12" y="12" width="17" height="17" rx="4" fill="#60a5fa"/><rect x="35" y="12" width="17" height="17" rx="4" fill="#34d399"/><rect x="12" y="35" width="17" height="17" rx="4" fill="#fbbf24"/><rect x="35" y="35" width="17" height="17" rx="4" fill="#f472b6"/></svg>
  <h1>내 레포 모음 <small>눌러서 바로 가기 ✨</small></h1>
  <span id="note"></span>
</header>
<main id="grid"></main>
<script>
const USER = "hong3007";
// 한국어 설명 (없는 레포는 언어만 표시)
const DESC = {
  laws_crawler: "소방 법령 DB · 폰 앱",
  CBT_trainer: "산업안전기사 필기 CBT 문제풀이",
  "espn-fantasy": "ESPN 판타지 농구 로스터 리포트",
  Fridgey: "냉장고 관리 · 유통기한·장보기",
  Travel_ong: "여행 노트",
  Blog_automation: "네이버 블로그 초안 도우미",
  Buddy: "2인 부동산 예산설계",
  "R-E-Designer": "2인 부동산 예산설계",
};
const EMOJI = { laws_crawler:"🚒", CBT_trainer:"📝", "espn-fantasy":"🏀", Fridgey:"🧊", Travel_ong:"✈️", Blog_automation:"✍️",
  Buddy:"🏠", "R-E-Designer":"🏡", Claude_remote:"🛰️", appology:"🙏", git_main:"🌱" };
const PASTEL = ["#ffb3c7", "#a8e6cf", "#ffe08a", "#a9d6ff", "#d4b8ff", "#ffc9a3"];
// 오프라인·API 제한 때 쓰는 기본 목록 (2026-11-24 기준) [이름, 사이트 있음, 언어]
const FALLBACK = [["laws_crawler",1,"JavaScript"],["CBT_trainer",1,"HTML"],["espn-fantasy",1,"Python"],["Fridgey",1,"HTML"],
  ["Travel_ong",1,"HTML"],["Blog_automation",1,"HTML"],["Buddy",1,"HTML"],["R-E-Designer",0,""],["Claude_remote",0,""],
  ["appology",1,"HTML"],["git_main",0,"Python"]].map(([name, p, language]) => ({ name, has_pages: !!p, language }));

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
function render(repos, note) {
  repos = repos.filter(r => r.homepage || r.has_pages);   // 사이트 있는 레포만
  document.getElementById("note").textContent = note || `사이트 ${repos.length}개`;
  document.getElementById("grid").innerHTML = repos.map((r, i) => {
    const code = `https://github.com/${USER}/${encodeURIComponent(r.name)}`;
    const site = r.homepage || (r.has_pages ? `https://${USER}.github.io/${encodeURIComponent(r.name)}/` : "");
    return `<a class="tile" style="--p:${PASTEL[i % PASTEL.length]};--i:${i};--r:${i % 2 ? 2 : -2}deg" href="${esc(site || code)}" target="_blank" rel="noopener">
      <span class="emo">${EMOJI[r.name] || "📦"}</span>
      <span class="name">${esc(r.name)}</span>
      <span class="desc">${esc(DESC[r.name] || r.description || r.language || "")}</span>
      ${site ? '<span class="site">🌐 사이트 열기</span>' : ""}
      ${site ? `<object><a class="code" href="${esc(code)}" target="_blank" rel="noopener" title="코드 보기">코드 ↗</a></object>` : ""}
    </a>`;
  }).join("");
}
render(FALLBACK, "");
// 열 때마다 최신 목록으로 바꿈 (새 레포 자동 반영). 실패하면 기본 목록 그대로.
fetch(`https://api.github.com/users/${USER}/repos?per_page=100&sort=pushed`)
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(list => (list = list.filter(r => !r.fork), render(list, "")))
  .catch(() => render(FALLBACK, "오프라인 목록"));
</script>
</body>
</html>
